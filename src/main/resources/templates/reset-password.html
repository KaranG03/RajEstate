<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - RajEstate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --dark-bg: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            background-image:
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%),
                radial-gradient(at 50% 100%, hsla(225,39%,30%,1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            overflow: hidden;
        }

        /* Wrapper */
        .wrapper {
            display: flex;
            width: 85%;
            max-width: 1100px;
            height: 85vh;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            animation: fadeIn 0.8s ease-out;
        }

        /* --- Left Side: Visuals --- */
        .left-panel {
            flex: 1;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(236, 72, 153, 0.1) 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            border-right: 1px solid var(--glass-border);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            z-index: 0;
        }
        .orb-1 { width: 200px; height: 200px; background: var(--primary); top: 10%; left: 10%; animation: float 8s infinite alternate; }
        .orb-2 { width: 150px; height: 150px; background: var(--secondary); bottom: 10%; right: 10%; animation: float 6s infinite alternate-reverse; }

        .visual-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 25px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            transform: rotate(-2deg);
            animation: floatCard 6s ease-in-out infinite;
            z-index: 1;
        }

        .icon-box {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 28px;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .left-text {
            text-align: center;
            z-index: 1;
        }
        .left-text h2 {
            font-size: 2.2rem;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .left-text p { color: var(--text-muted); font-size: 1rem; max-width: 80%; margin: 0 auto; }


        /* --- Right Side: Form --- */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            background: rgba(0,0,0,0.2);
            position: relative;
        }

        .nav-back {
            position: absolute;
            top: 30px;
            left: 30px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.3s;
        }
        .nav-back:hover { color: white; transform: translateX(-3px); }

        .form-header h2 { font-size: 2rem; margin-bottom: 5px; font-weight: 700; color: white; }
        .form-header p { color: var(--text-muted); margin-bottom: 30px; }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 16px 45px 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }
        input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }
        .input-group.invalid input { border-color: var(--danger); }

        .toggle-password {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            cursor: pointer; color: rgba(255, 255, 255, 0.6); font-size: 18px; transition: 0.3s;
        }
        .toggle-password:hover { color: white; }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }
        .btn:hover:not(:disabled) { transform: translateY(-2px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; background: #334155; }

        /* Status Elements */
        .loader {
            display: none; border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid white;
            border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 15px auto;
        }
        .error-box {
            display: none; background: rgba(239, 68, 68, 0.15); padding: 10px; border-radius: 8px;
            color: #fca5a5; font-size: 13px; margin-top: 15px; border: 1px solid rgba(239, 68, 68, 0.3); text-align: center;
        }
        .success-box {
            display: none; margin-top: 20px; text-align: center; animation: popIn 0.5s ease;
        }
        .tick { font-size: 50px; color: var(--success); display: block; margin-bottom: 10px; }
        .success-text { font-size: 16px; color: white; font-weight: 600; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes floatCard { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-10px) rotate(-2deg); } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        @media (max-width: 900px) {
            .wrapper { flex-direction: column; height: auto; padding-bottom: 40px; }
            .left-panel { min-height: 200px; padding: 30px; }
            .visual-card { display: none; }
            .right-panel { padding: 40px 30px; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="left-panel">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>

        <div class="visual-card">
            <div class="icon-box">🔒</div>
            <div style="text-align:center;">
                <strong style="display:block; font-size:16px; color:white;">Secure Recovery</strong>
                <span style="font-size:12px; color:#cbd5e1;">Your data is protected</span>
            </div>
        </div>

        <div class="left-text">
            <h2>Account Recovery</h2>
            <p>Create a strong password to regain access to your dashboard.</p>
        </div>
    </div>

    <div class="right-panel">
        <a href="/login" class="nav-back">← Back to Login</a>

        <div class="form-header" id="headerContent">
            <h2>Reset Password</h2>
            <p>Enter your new password below.</p>
        </div>

        <input type="hidden" id="reset-mail">

        <div id="formContainer">
            <div class="input-group" id="passwordGroup">
                <input type="password" id="new-password" placeholder="New Password" required oninput="validatePasswordInput()">
                <span class="toggle-password" onclick="togglePassword()">👁️</span>
            </div>

            <button class="btn" id="resetBtn" onclick="resetPassword()" disabled>Reset Password</button>
        </div>

        <div class="loader" id="loader"></div>
        <div class="error-box" id="errorBox">Failed to reset. Please try again.</div>

        <div class="success-box" id="successBox">
            <span class="tick">✅</span>
            <div class="success-text">Password Reset Successfully!</div>
            <p style="color:var(--text-muted); font-size:14px; margin-top:5px;">Redirecting to login...</p>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const urlParams = new URLSearchParams(window.location.search);
        const mail = urlParams.get('mail');
        document.getElementById('reset-mail').value = mail;
    });

    function validatePasswordInput() {
        const password = document.getElementById("new-password").value;
        const passwordGroup = document.getElementById("passwordGroup");
        const resetBtn = document.getElementById("resetBtn");
        const errorBox = document.getElementById("errorBox");

        const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{6,}$/;

        if (regex.test(password)) {
            errorBox.style.display = "none";
            passwordGroup.classList.remove("invalid");
            resetBtn.removeAttribute("disabled");
        } else {
            // Optional: Show hint on typing or just keep button disabled
            // For cleaner UI, we just keep button disabled until valid
            passwordGroup.classList.add("invalid");
            resetBtn.setAttribute("disabled", "true");
        }
    }

    async function resetPassword() {
        const mail = document.getElementById('reset-mail').value;
        const newPassword = document.getElementById('new-password').value.trim();
        const loader = document.getElementById('loader');
        const formContainer = document.getElementById('formContainer');
        const successBox = document.getElementById('successBox');
        const errorBox = document.getElementById('errorBox');
        const header = document.getElementById('headerContent');

        // Validation check before sending
        const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{6,}$/;
        if (!regex.test(newPassword)) {
            errorBox.innerText = "Password must be >6 chars, with Uppercase, Lowercase, Number & Special Char.";
            errorBox.style.display = "block";
            return;
        }

        formContainer.style.display = 'none'; // Hide form
        loader.style.display = "block";
        errorBox.style.display = "none";

        try {
            const response = await fetch(`https://rajestate.onrender.com/user/reset-password?mail=${mail}&newP=${newPassword}`, {
                method: 'POST',
            });

            loader.style.display = "none";

            if (response.ok) {
                header.style.display = 'none'; // Hide header text
                successBox.style.display = "block"; // Show success
                setTimeout(() => {
                    window.location.href = "/login";
                }, 2000);
            } else {
                formContainer.style.display = 'block'; // Show form again
                errorBox.innerText = "Failed to reset password. Link might be expired.";
                errorBox.style.display = "block";
            }
        } catch (error) {
            loader.style.display = "none";
            formContainer.style.display = 'block';
            errorBox.innerText = "Network Error. Please try again.";
            errorBox.style.display = "block";
        }
    }

    function togglePassword() {
        const passwordField = document.getElementById("new-password");
        const icon = document.querySelector('.toggle-password');
        if(passwordField.type === "password"){
            passwordField.type = "text";
            icon.textContent = "🙈";
        } else {
            passwordField.type = "password";
            icon.textContent = "👁️";
        }
    }
</script>

</body>
</html>
