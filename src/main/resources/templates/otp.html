<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - RajEstate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; /* Indigo */
            --secondary: #ec4899; /* Pink */
            --dark-bg: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            background-image:
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%),
                radial-gradient(at 50% 100%, hsla(225,39%,30%,1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            overflow: hidden;
        }

        /* Ambient Blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
        }
        .blob-1 { top: 10%; left: 10%; width: 300px; height: 300px; background: var(--primary); animation: float 8s infinite alternate; }
        .blob-2 { bottom: 10%; right: 10%; width: 300px; height: 300px; background: var(--secondary); animation: float 10s infinite alternate-reverse; }

        /* Wrapper */
        .wrapper {
            display: flex;
            width: 85%;
            max-width: 1000px;
            height: 80vh;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            animation: fadeIn 0.8s ease-out;
            position: relative;
            z-index: 1;
        }

        /* --- Left Side --- */
        .left-panel {
            flex: 1;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(236, 72, 153, 0.1) 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            border-right: 1px solid var(--glass-border);
        }

        .visual-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 25px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            transform: rotate(-2deg);
            animation: floatCard 6s ease-in-out infinite;
        }

        .icon-box {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 28px;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .left-text h2 {
            font-size: 2.2rem;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .left-text p { color: var(--text-muted); font-size: 1rem; text-align: center; max-width: 80%; margin: 0 auto; }

        /* --- Right Side --- */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            background: rgba(0,0,0,0.2);
            position: relative;
        }

        .form-header h2 { font-size: 2rem; margin-bottom: 5px; font-weight: 700; color: white; }
        .form-header p { color: var(--text-muted); margin-bottom: 30px; }

        input {
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 20px;
            text-align: center; /* Center for OTP */
            letter-spacing: 2px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        /* Timer */
        .timer-display {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: var(--secondary);
            font-weight: 600;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; background: #334155; }

        /* Status & Loaders */
        .loader {
            display: none; border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid white;
            border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 15px auto;
        }

        .error-box {
            display: none; background: rgba(239, 68, 68, 0.15); padding: 10px; border-radius: 8px;
            color: #fca5a5; font-size: 13px; margin-top: 20px; border: 1px solid rgba(239, 68, 68, 0.3); text-align: center;
        }

        .success-icon {
            display: none; font-size: 50px; color: var(--success); margin: 20px auto; text-align: center;
            animation: popIn 0.5s ease;
        }

        /* Animations */
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes floatCard { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-10px) rotate(-2deg); } }
        @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        @media (max-width: 900px) {
            .wrapper { flex-direction: column; height: auto; padding-bottom: 30px; }
            .left-panel { min-height: 200px; padding: 30px; }
            .visual-card { display: none; }
            .right-panel { padding: 40px; }
        }
    </style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="wrapper">
    <div class="left-panel">
        <div class="visual-card">
            <div class="icon-box">🛡️</div>
            <div style="text-align:center;">
                <strong style="display:block; font-size:16px; color:white;">Security Check</strong>
                <span style="font-size:12px; color:#cbd5e1;">One-Time Password</span>
            </div>
        </div>
        <div class="left-text">
            <h2>Verification</h2>
            <p>We've sent a code to your registered email address.</p>
        </div>
    </div>

    <div class="right-panel">
        <div class="form-header">
            <h2>Enter OTP</h2>
            <p>Please enter the verification code below.</p>
        </div>

        <input type="hidden" id="otp-email">
        <input type="text" id="otp" placeholder="XXXXXX" maxlength="6" required>

        <div id="timer-display" class="timer-display"></div>

        <button class="btn" onclick="verifyOTP()">Verify Code</button>

        <div class="loader" id="loader"></div>
        <div class="success-icon" id="tick">✅</div>
        <div class="error-box" id="errorBox">Invalid or expired OTP. Please try again.</div>
    </div>
</div>

<script>
        document.addEventListener("DOMContentLoaded", function () {
            const urlParams = new URLSearchParams(window.location.search);
            const mail = urlParams.get('mail');
            document.getElementById('otp-email').value = mail;

            // Clear all history and prevent navigation
            history.replaceState(null, "", location.href);
            window.onpopstate = function () {
                history.pushState(null, "", location.href);
            };

            // Force session history to reset
            if (window.history && window.history.pushState) {
                window.history.pushState({}, document.title, window.location.href);
                window.history.replaceState({}, document.title, window.location.href);
            }

            // Timer Implementation
            let timeLeft = 300; // 5 minutes in seconds
            const timerDisplay = document.getElementById("timer-display");

            function updateTimer() {
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                timerDisplay.textContent = `Expires in: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

                if (timeLeft <= 0) {
                    document.getElementById("otp").disabled = true;
                    timerDisplay.textContent = "OTP expired. Please request a new one.";
                    timerDisplay.style.color = "var(--danger)";
                } else {
                    timeLeft--;
                    setTimeout(updateTimer, 1000);
                }
            }
            updateTimer();
        });

        document.getElementById("otp").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                verifyOTP();
            }
        });

        async function verifyOTP() {
            const mail = document.getElementById('otp-email').value;
            const otp = document.getElementById('otp').value.trim();
            const loader = document.getElementById('loader');
            const tick = document.getElementById('tick');
            const errorBox = document.getElementById('errorBox');
            const btn = document.querySelector('.btn');

            if (!otp) {
                errorBox.textContent = "Please enter the OTP.";
                errorBox.style.display = 'block';
                return;
            }

            // UI State: Loading
            btn.style.display = 'none';
            loader.style.display = "block";
            tick.style.display = "none";
            errorBox.style.display = "none";

            try {
                const response = await fetch('https://rajestate.onrender.com/verification', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mail, otp }),
                });

                loader.style.display = "none";

                if (response.ok) {
                    tick.style.display = "block";
                    // Transition to reset password
                    setTimeout(() => {
                        window.location.href = `/reset-password?mail=${mail}`;
                    }, 1000);
                } else {
                    errorBox.style.display = "block";
                    btn.style.display = 'block'; // Show button again to retry
                }
            } catch (error) {
                loader.style.display = "none";
                errorBox.textContent = "Network error. Please try again.";
                errorBox.style.display = "block";
                btn.style.display = 'block';
            }
        }
    </script>

</body>
</html>
