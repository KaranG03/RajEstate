<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Colony - RajEstate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --dark-bg: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            background-image:
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%),
                radial-gradient(at 50% 100%, hsla(225,39%,30%,1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            overflow: hidden;
        }

        /* Ambient Blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: -1;
        }
        .blob-1 { top: -10%; left: -10%; width: 400px; height: 400px; background: var(--primary); animation: float 10s infinite alternate; }
        .blob-2 { bottom: -10%; right: -10%; width: 400px; height: 400px; background: var(--secondary); animation: float 8s infinite alternate-reverse; }

        /* Main Card */
        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            animation: fadeIn 0.8s ease-out;
            position: relative;
        }

        h2 {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Form Group */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder { color: rgba(255, 255, 255, 0.3); }

        input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        #add-btn {
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        #add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
        }
        #add-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        #cancel-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
        }
        #cancel-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-color: white;
        }

        /* Status & Loading */
        .loading {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--secondary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        .status-message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
            backdrop-filter: blur(10px);
            animation: slideUp 0.3s ease;
        }

        .success {
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.5);
        }

        .error {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.5);
        }

        /* Animations */
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes float { 0% { transform: translate(0, 0); } 100% { transform: translate(30px, 30px); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Mobile */
        @media (max-width: 600px) {
            .container { margin: 20px; padding: 30px; }
        }
    </style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="container" id="new-colony-container">
    <h2>Create New Colony</h2>

    <form id="new-colony-form">
        <div class="form-group">
            <label for="new-colony-name">Colony Name</label>
            <input type="text" id="new-colony-name" placeholder="e.g. Royal Gardens" required>
        </div>

        <div class="form-group">
            <label for="new-colony-location">Location</label>
            <input type="text" id="new-colony-location" placeholder="e.g. Sector 4, Main Road" required>
        </div>

        <div class="form-group">
            <label for="new-colony-partners">Partners <span style="font-weight:400; font-size:12px; opacity:0.6;">(Optional)</span></label>
            <input type="text" id="new-colony-partners" placeholder="e.g. John Doe, Jane Smith">
        </div>

        <div class="form-group">
            <label for="new-colony-numPlots">Total Plots</label>
            <input type="number" id="new-colony-numPlots" placeholder="e.g. 50" required>
        </div>

        <div class="btn-group">
            <button type="button" id="cancel-btn" onclick="hideNewColonyForm()">Cancel</button>
            <button type="button" id="add-btn" onclick="createNewColony()">Add Colony</button>
        </div>
    </form>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <span>Creating Colony...</span>
    </div>

    <div id="status-message" class="status-message"></div>
</div>

<script>
        // No display block needed on load as CSS handles visibility
        // window.onload removed to avoid flickering, default display is flex in body

        function hideNewColonyForm() {
            window.location.href = '/colonies-list';
        }

        async function createNewColony() {
            const name = document.getElementById('new-colony-name').value.trim();
            const location = document.getElementById('new-colony-location').value.trim();
            const partnersInput = document.getElementById('new-colony-partners').value;
            const numPlotsInput = document.getElementById('new-colony-numPlots').value;

            const partners = partnersInput ? partnersInput.split(',').map(p => p.trim()) : [];
            const numPlots = parseInt(numPlotsInput, 10);

            const token = localStorage.getItem('token');

            // Diagnostics
            console.log("Token:", token);
            console.log("Name:", name);
            console.log("Location:", location);
            console.log("Partners:", partners);
            console.log("NumPlots:", numPlots);

            if (!name || !location || isNaN(numPlots)) {
                showMessage("Please fill all required fields.", "error");
                return;
            }

            if (!token) {
                showMessage("No authentication token found. Please log in.", "error");
                return;
            }

            const data = { name, location, partners, numPlots };
            console.log("Request Payload:", JSON.stringify(data));

            document.getElementById('add-btn').disabled = true;
            document.getElementById('loading').style.display = 'flex'; // Changed to flex for centering
            document.getElementById('status-message').style.display = 'none';

            try {
                const response = await fetch('https://rajestate.onrender.com/user', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                    },
                    body: JSON.stringify(data),
                });

                if (response.ok) {
                    showMessage("Colony added successfully!", "success");
                    setTimeout(() => {
                        window.location.href = '/colonies-list';
                    }, 2000);
                } else {
                    const error = await response.text();
                    console.error("Server responded with error:", error);
                    showMessage(`Failed to add colony: ${error}`, "error");
                }
            } catch (error) {
                console.error("Caught fetch error:", error);
                showMessage("An error occurred while adding colony.", "error");
            } finally {
                document.getElementById('add-btn').disabled = false;
                document.getElementById('loading').style.display = 'none';
            }
        }

        function showMessage(message, type) {
            const messageBox = document.getElementById('status-message');
            messageBox.innerText = message;
            messageBox.className = `status-message ${type}`;
            messageBox.style.display = 'block';
        }
    </script>

</body>
</html>
