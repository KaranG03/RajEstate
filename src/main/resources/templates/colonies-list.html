<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - RajEstate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --dark-bg: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            background-image:
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            min-height: 100vh;
            color: var(--text-main);
            padding-bottom: 50px;
        }

        /* Ambient Background Blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            z-index: -1;
        }
        .blob-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: var(--primary); }
        .blob-2 { bottom: -10%; right: -10%; width: 500px; height: 500px; background: var(--secondary); }

        /* --- Header --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .fixed-buttons {
            display: flex;
            gap: 15px;
        }

        .header-btn {
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--glass-border);
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        #show-customers-btn {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            border-color: rgba(99, 102, 241, 0.4);
        }
        #show-customers-btn:hover { background: rgba(99, 102, 241, 0.4); color: white; }

        #logout-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.4);
        }
        #logout-btn:hover { background: rgba(239, 68, 68, 0.3); color: white; }

        /* --- Controls Section --- */
        .controls-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin: 40px 0 30px;
            padding: 0 20px;
            animation: fadeIn 0.8s ease-out;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px; /* Wider search bar */
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0.6;
            pointer-events: none;
        }

        #search-input {
            width: 100%;
            padding: 18px 20px 18px 50px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 16px;
            backdrop-filter: blur(10px);
            outline: none;
            transition: all 0.3s ease;
        }

        #search-input::placeholder { color: rgba(255, 255, 255, 0.4); }

        #search-input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        #add-colony-btn {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white;
            font-size: 18px;
            font-weight: 600;
            padding: 16px 50px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #add-colony-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(99, 102, 241, 0.6); }

        /* --- Grid System --- */
        #colony-grid {
            display: grid;
            /* Wider columns for bigger cards */
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 40px;
            padding: 20px 40px;
            max-width: 1600px;
            margin: auto;
            animation: fadeIn 1s ease-out;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 18px;
            background: rgba(255,255,255,0.02);
            border-radius: 20px;
            border: 1px dashed var(--glass-border);
        }

        /* --- Colony Card (BIGGER) --- */
        .colony-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 35px; /* More padding */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 320px; /* Taller card */
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .colony-box:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .colony-name {
            font-size: 28px; /* Larger Title */
            font-weight: 700;
            color: white;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .colony-details {
            display: flex;
            flex-direction: column;
            gap: 15px; /* More space between details */
            margin-bottom: 30px;
        }

        .colony-details p {
            font-size: 16px; /* Larger text */
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-badge {
            width: 32px; height: 32px; /* Bigger Icons */
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }

        /* Full width button since delete is gone */
        .card-actions {
            margin-top: auto;
            width: 100%;
        }

        .btn-view {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .btn-view:hover {
            filter: brightness(1.2);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.6);
        }

        /* --- Modals & Loaders --- */
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px);
            justify-content: center; align-items: center; animation: fadeIn 0.3s ease;
        }
        .modal-content {
            background: #1e293b; padding: 30px; border-radius: 20px; border: 1px solid var(--glass-border);
            text-align: center; width: 90%; max-width: 400px; color: white;
        }
        .modal-buttons { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
        .modal-btn { padding: 12px 24px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; }
        .confirm-btn { background: #ef4444; color: white; }
        .cancel-btn { background: rgba(255,255,255,0.1); color: white; }

        .loader-container { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 200px; color: var(--text-muted); }
        .loader { border: 4px solid rgba(255, 255, 255, 0.1); border-top: 4px solid var(--secondary); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 15px; }

        #toast-container { position: fixed; top: 90px; right: 30px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 15px 25px; border-radius: 12px; color: white; font-weight: 500; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); opacity: 0; transform: translateX(100%); animation: slideIn 0.4s forwards, fadeOut 0.5s 2.5s forwards; }
        .toast.success { background: rgba(16, 185, 129, 0.9); border-left: 5px solid #047857; }
        .toast.error { background: rgba(239, 68, 68, 0.9); border-left: 5px solid #b91c1c; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }
        @keyframes fadeOut { to { opacity: 0; transform: translateX(100%); } }

        @media (max-width: 600px) {
            .header { padding: 15px 20px; }
            h2 { font-size: 20px; }
            #colony-grid { padding: 10px 20px; grid-template-columns: 1fr; } /* Stack cards on mobile */
            .controls-container { padding: 0 20px; }
        }
    </style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div id="toast-container"></div>

<div class="header">
    <h2>Dashboard</h2>
    <div class="fixed-buttons">
        <button id="show-customers-btn" class="header-btn" onclick="redirectToCustomers()">👥 Customers</button>
        <button id="logout-btn" class="header-btn" onclick="openLogoutModal()">🚪 Logout</button>
    </div>
</div>

<div class="controls-container">
    <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search colonies by name, location, or partner...">
    </div>

    <button id="add-colony-btn" onclick="redirectToAddColony()">+ Add New Colony</button>
</div>

<div id="loader" class="loader-container">
    <div class="loader"></div>
    <p>Loading your portfolio...</p>
</div>

<div id="colony-grid"></div>

<div id="logout-modal" class="modal">
    <div class="modal-content">
        <h3>Sign Out?</h3>
        <p>You will be returned to the login screen.</p>
        <div class="modal-buttons">
            <button class="modal-btn cancel-btn" onclick="closeLogoutModal()">Stay</button>
            <button class="modal-btn confirm-btn" onclick="logout()">Logout</button>
        </div>
    </div>
</div>

<script>
        // Global variable to store fetched data for searching
        let allColonies = [];

        document.addEventListener('DOMContentLoaded', () => {
            fetchColonyList();
            preventBackNavigation();

            // Add Search Event Listener
            document.getElementById('search-input').addEventListener('input', handleSearch);
        });

        async function fetchColonyList() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/login';
                return;
            }
            document.getElementById('loader').style.display = 'flex';
            document.getElementById('colony-grid').style.display = 'none';

            try {
                const response = await fetch('https://rajestate.onrender.com/user', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                    },
                });

                if (response.ok) {
                    allColonies = await response.json(); // Store in global variable
                    displayColonyList(allColonies);
                }
            } catch (error) {
                console.error('Error fetching colonies:', error);
                showToast('Failed to load data', 'error');
            }
            finally {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('colony-grid').style.display = 'grid';
            }
        }

        // Search Logic
        function handleSearch(e) {
            const term = e.target.value.toLowerCase();

            const filtered = allColonies.filter(colony => {
                const nameMatch = colony.name.toLowerCase().includes(term);
                const locationMatch = colony.location.toLowerCase().includes(term);
                const partnerMatch = colony.partners && colony.partners.some(p => p.toLowerCase().includes(term));

                return nameMatch || locationMatch || partnerMatch;
            });

            displayColonyList(filtered);
        }

        function displayColonyList(colonies) {
            const colonyGrid = document.getElementById('colony-grid');
            colonyGrid.innerHTML = '';

            if (colonies.length === 0) {
                colonyGrid.innerHTML = '<div class="no-results">No colonies found matching your search.</div>';
                return;
            }

            colonies.forEach(colony => {
                const colonyBox = document.createElement('div');
                colonyBox.classList.add('colony-box');
                colonyBox.innerHTML = `
                    <div>
                        <h3 class="colony-name">${colony.name}</h3>
                        <div class="colony-details">
                            <p><span class="icon-badge">📍</span> ${colony.location}</p>
                            <p><span class="icon-badge">🤝</span> ${colony.partners ? colony.partners.join(', ') : 'N/A'}</p>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-view" onclick="redirectToPlotPage('${colony.id}')">🔍 View Plots</button>
                    </div>
                `;
                colonyGrid.appendChild(colonyBox);
            });
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = type === 'success' ? `✅ ${message}` : `⚠️ ${message}`;

            document.getElementById('toast-container').appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        function redirectToPlotPage(colonyId) {
            window.location.href = `/plot?colonyId=${colonyId}`;
        }

        function redirectToAddColony() {
            window.location.href = '/add-colony';
        }

        function redirectToCustomers() {
            window.location.href = '/customers';
        }

        function openLogoutModal() {
            document.getElementById('logout-modal').style.display = 'flex';
        }

        function closeLogoutModal() {
            document.getElementById('logout-modal').style.display = 'none';
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/login';
        }

        function preventBackNavigation() {
            history.pushState(null, null, location.href);
            window.onpopstate = function () {
                logout();
            };
        }
    </script>

</body>
</html>
