<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RajEstate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; /* Indigo */
            --secondary: #ec4899; /* Pink */
            --dark-bg: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --error-bg: rgba(239, 68, 68, 0.2);
            --error-text: #fca5a5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--dark-bg);
            /* Consistent Deep Mesh Gradient */
            background-image:
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%),
                radial-gradient(at 50% 100%, hsla(225,39%,30%,1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            color: white;
            overflow: hidden;
        }

        /* Wrapper */
        .wrapper {
            display: flex;
            width: 85%;
            max-width: 1100px;
            height: 85vh;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            animation: fadeIn 0.8s ease-out;
        }

        /* --- Left Side: Visuals --- */
        .left-panel {
            flex: 1;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(236, 72, 153, 0.1) 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            border-right: 1px solid var(--glass-border);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
        }
        .orb-1 { width: 200px; height: 200px; background: var(--primary); top: 10%; left: 10%; animation: float 8s infinite alternate; }
        .orb-2 { width: 150px; height: 150px; background: var(--secondary); bottom: 10%; right: 10%; animation: float 6s infinite alternate-reverse; }

        .visual-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px 30px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            transform: rotate(-2deg);
            animation: floatCard 6s ease-in-out infinite;
        }

        .icon-box {
            width: 45px; height: 45px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            font-size: 20px;
        }

        .left-text {
            text-align: center;
            z-index: 2;
        }
        .left-text h2 {
            font-size: 2.5rem;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .left-text p { color: var(--text-muted); font-size: 1.1rem; max-width: 80%; margin: 0 auto; }

        /* --- Right Side: Form --- */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            background: rgba(0,0,0,0.2);
            position: relative;
        }

        .form-header h2 { font-size: 2rem; margin-bottom: 5px; font-weight: 700; color: white; }
        .form-header p { color: var(--text-muted); margin-bottom: 30px; }

        .input-box {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder { color: rgba(255, 255, 255, 0.3); }

        input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: rgba(255, 255, 255, 0.6);
            font-size: 18px;
            transition: 0.3s;
        }
        .toggle-password:hover { color: white; }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
        }

        /* Loader */
        .loader {
            display: none;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--secondary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 15px auto;
        }

        /* Error Box */
        .error-box {
            display: none;
            background: var(--error-bg);
            padding: 12px;
            border-radius: 8px;
            color: var(--error-text);
            margin-top: 20px;
            font-size: 14px;
            text-align: center;
            border: 1px solid rgba(239, 68, 68, 0.3);
            animation: shake 0.3s ease-in-out;
        }

        .links {
            margin-top: 25px;
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
        }

        .links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .links a:hover {
            color: var(--secondary);
            text-decoration: underline;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(20px, 20px); }
        }
        @keyframes floatCard {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-10px) rotate(-2deg); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Responsive */
        @media (max-width: 900px) {
            .wrapper { flex-direction: column; height: auto; width: 95%; margin: 20px; }
            .left-panel { padding: 40px; min-height: 250px; }
            .right-panel { padding: 40px; }
            .visual-card { display: none; }
            .left-text h2 { font-size: 2rem; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="left-panel">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>

        <div class="visual-card">
            <div class="icon-box">🔑</div>
            <div>
                <strong style="display:block; font-size:14px; color:white;">Secure Access</strong>
                <span style="font-size:12px; color:#cbd5e1;">256-bit Encryption</span>
            </div>
        </div>

        <div class="left-text">
            <h2>Welcome Back</h2>
            <p>Sign in to manage your properties and view the latest market insights.</p>
        </div>
    </div>

    <div class="right-panel">
        <div class="form-header">
            <h2>Login</h2>
            <p>Enter your credentials to continue.</p>
        </div>

        <form id="loginForm">
            <div class="input-box">
                <input type="text" id="login-username" placeholder="Username" required>
            </div>

            <div class="input-box">
                <input type="password" id="login-password" placeholder="Password" required>
                <span class="toggle-password" onclick="togglePassword()">👁️</span>
            </div>

            <div class="loader" id="loader"></div>

            <button type="submit" class="btn">Login</button>
        </form>

        <div class="error-box" id="errorBox">❌ Invalid username or password</div>

        <div class="links">
            <p><a href="/forgot-password">Forgot Password?</a></p>
            <p style="margin-top: 10px;">New user? <a href="/signup">Sign up here</a></p>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        history.replaceState(null, "", location.href);
        history.pushState(null, "", location.href);
        window.onpopstate = function () {
            history.pushState(null, "", location.href);
        };

        sessionStorage.setItem("allowedNavigation", "true");
    });

    function togglePassword() {
        let passwordInput = document.getElementById("login-password");
        let eyeIcon = document.querySelector(".toggle-password");
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            eyeIcon.textContent = "🙈";
        } else {
            passwordInput.type = "password";
            eyeIcon.textContent = "👁️";
        }
    }

    document.getElementById("loginForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value.trim();
        const loader = document.getElementById('loader');
        const errorBox = document.getElementById('errorBox');

        if (!username || !password) {
            errorBox.textContent = "⚠️ Please fill in all fields!";
            errorBox.style.display = "block";
            return;
        }

        loader.style.display = "block";
        errorBox.style.display = "none";

        try {
            const response = await fetch('https://rajestate.onrender.com/public/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
            });

            loader.style.display = "none";

            if (response.ok) {
                const jwt = await response.text();
                localStorage.setItem('token', jwt);
                window.location.href = "/colonies-list";
            } else {
                errorBox.textContent = "❌ Invalid username or password!";
                errorBox.style.display = "block";
            }
        } catch (error) {
            loader.style.display = "none";
            errorBox.textContent = "⚠️ Network error! Try again later.";
            errorBox.style.display = "block";
        }
    });
</script>

</body>
</html>
