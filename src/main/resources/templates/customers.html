<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer List - RajEstate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --dark-bg: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            background-image:
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%),
                radial-gradient(at 50% 100%, hsla(225,39%,30%,1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            min-height: 100vh;
            color: var(--text-main);
            padding-bottom: 50px;
        }

        /* Ambient Blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            z-index: -1;
        }
        .blob-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: var(--primary); }
        .blob-2 { bottom: -10%; right: -10%; width: 500px; height: 500px; background: var(--secondary); }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
            font-weight: 600;
        }
        .back-btn:hover { background: rgba(255, 255, 255, 0.2); }

        /* Container */
        .customer-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Customer Card */
        .customer-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
            animation: fadeIn 0.5s ease-out;
        }

        .customer-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255,255,255,0.2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .cust-name {
            font-size: 20px;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cust-phone {
            font-size: 14px;
            color: var(--secondary);
            font-weight: 600;
            background: rgba(236, 72, 153, 0.1);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(236, 72, 153, 0.3);
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .detail-item {
            font-size: 14px;
            color: var(--text-muted);
        }
        .detail-item strong {
            color: white;
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 4px;
        }

        /* Plot List Styling */
        .plots-section {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 12px;
        }

        .plots-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .plot-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .plot-tag {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(99, 102, 241, 0.1));
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #e0e7ff;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .plot-tag span {
            font-size: 11px;
            opacity: 0.7;
        }

        /* Loading */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 50vh;
            color: var(--text-muted);
        }

        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        .no-data {
            text-align: center;
            color: var(--text-muted);
            font-size: 16px;
            margin-top: 50px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 600px) {
            .header { padding: 15px 20px; }
            .details-grid { grid-template-columns: 1fr; }
            .card-header { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="header">
    <h2>Customer List</h2>
    <button class="back-btn" onclick="goBack()">← Back</button>
</div>

<div class="customer-container">
    <div id="loading" class="loading-container">
        <div class="spinner"></div>
        Loading customers...
    </div>
    <div id="customer-list"></div>
</div>

<script>
        document.addEventListener('DOMContentLoaded', fetchAllCustomers);

        async function fetchAllCustomers() {
            const token = localStorage.getItem('token');
            const loadingDiv = document.getElementById('loading');
            const customerList = document.getElementById('customer-list');

            try {
                const response = await fetch('https://rajestate.onrender.com/user/all-cust', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                    },
                });

                if (response.ok) {
                    const customers = await response.json();
                    displayCustomers(customers);
                } else {
                    const error = await response.text();
                    alert(`Failed to fetch customers: ${error}`); // Keeping simple alert for errors
                }
            } catch (error) {
                console.error('Error fetching customers:', error);
            } finally {
                loadingDiv.style.display = 'none';
            }
        }

        function displayCustomers(customers) {
            const customerList = document.getElementById('customer-list');
            customerList.innerHTML = '';

            if (customers.length === 0) {
                customerList.innerHTML = '<div class="no-data">No customers found.</div>';
                return;
            }

            customers.forEach(c => {
                const card = document.createElement('div');
                card.classList.add('customer-card');

                // Generate Plot Tags
                let plotsHtml = '';
                if (c.custPlots && c.custPlots.length > 0) {
                    plotsHtml = c.custPlots.map(plot => `
                        <div class="plot-tag">
                            <strong>Plot ${plot.plotNo}</strong>
                            <span>${plot.colonyName} • ₹${Number(plot.price).toLocaleString()}</span>
                        </div>
                    `).join('');
                } else {
                    plotsHtml = '<span style="color:var(--text-muted); font-size:13px;">No plots assigned.</span>';
                }

                card.innerHTML = `
                    <div class="card-header">
                        <div class="cust-name">
                            <span>👤</span> ${c.custName || 'Unknown Name'}
                        </div>
                        <div class="cust-phone">📞 ${c.phNum || 'N/A'}</div>
                    </div>

                    <div class="details-grid">
                        <div class="detail-item">
                            <strong>Address</strong>
                            ${c.address || 'N/A'}
                        </div>
                        <div class="detail-item">
                            <strong>Aadhar Number</strong>
                            ${c.aadharNum || 'N/A'}
                        </div>
                    </div>

                    <div class="plots-section">
                        <div class="plots-title">Purchased Plots</div>
                        <div class="plot-tags">
                            ${plotsHtml}
                        </div>
                    </div>
                `;
                customerList.appendChild(card);
            });
        }

        function goBack() {
            window.history.back();
        }
    </script>

</body>
</html>
