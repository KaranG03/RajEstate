<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Plot - RajEstate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --dark-bg: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            background-image:
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%),
                radial-gradient(at 50% 100%, hsla(225,39%,30%,1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            padding: 40px 0;
        }

        /* Ambient Blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            z-index: -1;
        }
        .blob-1 { top: -10%; left: -10%; width: 400px; height: 400px; background: var(--primary); animation: float 10s infinite alternate; }
        .blob-2 { bottom: -10%; right: -10%; width: 400px; height: 400px; background: var(--secondary); animation: float 8s infinite alternate-reverse; }

        /* Main Container */
        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            animation: fadeIn 0.8s ease-out;
            position: relative;
        }

        h2 {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Form Grid for better layout */
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width {
            grid-column: span 2;
        }

        /* Input Groups */
        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: rgba(0,0,0,0.2);
        }

        input:focus, select:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }

        option {
            background: #1e293b;
            color: white;
        }

        /* Buttons */
        .btn-group {
            grid-column: span 2;
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        #save-btn {
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        #save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
        }

        #cancel-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
        }
        #cancel-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-color: white;
        }

        /* Loading Spinner */
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(5px);
            border-radius: 24px;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--secondary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* Custom Modal */
        .modal {
            display: none;
            position: fixed;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            text-align: center;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .modal-btn {
            margin-top: 20px;
            background: var(--success);
            color: white;
            width: auto;
            padding: 10px 30px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            form { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .container { padding: 30px 20px; margin: 20px; }
            .btn-group { grid-column: span 1; }
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0% { transform: translate(0, 0); } 100% { transform: translate(30px, 30px); } }
    </style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="container">
    <h2>Edit Plot Details</h2>

    <div class="loading-overlay" id="loadingSpinner">
        <div class="spinner"></div>
    </div>

    <form id="plot-edit-form">
        <div class="form-group">
            <label>Plot Number</label>
            <input type="text" id="plotNo" disabled>
        </div>

        <div class="form-group">
            <label>Status</label>
            <select id="sold">
                <option value="true">Sold</option>
                <option value="false">Available</option>
            </select>
        </div>

        <div class="form-group">
            <label>Price (₹)</label>
            <input type="number" id="price">
        </div>

        <div class="form-group">
            <label>Current Owner</label>
            <input type="text" id="owner">
        </div>

        <div class="form-group">
            <label>Registered To</label>
            <input type="text" id="regTo">
        </div>

        <div class="form-group">
            <label>Customer Phone</label>
            <input type="tel" id="custPhoneNum">
        </div>

        <div class="form-group full-width">
            <label>Customer Aadhar</label>
            <input type="text" id="custAadhar">
        </div>

        <div class="form-group full-width">
            <label>Customer Address</label>
            <input type="text" id="custAdd">
        </div>

        <div class="form-group full-width">
            <label>Additional Notes</label>
            <input type="text" id="note">
        </div>

        <div class="btn-group">
            <button type="button" id="cancel-btn" onclick="window.history.back()">Cancel</button>
            <button type="button" id="save-btn" onclick="savePlotDetails()">Save Changes</button>
        </div>
    </form>
</div>

<div class="modal" id="successModal">
    <div class="modal-content">
        <h3 style="color: white; margin-bottom: 10px;">Success</h3>
        <p id="successMessage" style="color: #cbd5e1;">Plot updated successfully!</p>
        <button class="modal-btn" onclick="closeModal()">OK</button>
    </div>
</div>

<script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const plotId = urlParams.get('plotId');
            const token = localStorage.getItem('token');

            if (!plotId) {
                alert('Invalid plot selection.');
                return;
            }

            // Show loading
            document.getElementById('loadingSpinner').style.display = 'flex';

            try {
                const response = await fetch(`https://rajestate.onrender.com/plot/${plotId}`, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` },
                });

                if (response.ok) {
                    const plot = await response.json();
                    document.getElementById('plotNo').value = plot.plotNo;
                    document.getElementById('price').value = plot.price;
                    document.getElementById('owner').value = plot.owner;
                    document.getElementById('sold').value = plot.sold.toString();
                    document.getElementById('regTo').value = plot.regTo;
                    document.getElementById('custAadhar').value = plot.custAadhar;
                    document.getElementById('custPhoneNum').value = plot.custPhoneNum;
                    document.getElementById('custAdd').value = plot.custAdd;
                    document.getElementById('note').value = plot.note;
                } else {
                    alert('Failed to fetch plot details.');
                }
            } catch (error) {
                console.error('Error fetching plot details:', error);
            } finally {
                // Hide loading
                document.getElementById('loadingSpinner').style.display = 'none';
            }
        });

        async function savePlotDetails() {
            const plotId = new URLSearchParams(window.location.search).get('plotId');
            const token = localStorage.getItem('token');
            const saveButton = document.getElementById('save-btn');

            const plotDetails = {
                plotNo: document.getElementById('plotNo').value,
                price: document.getElementById('price').value,
                owner: document.getElementById('owner').value,
                sold: document.getElementById('sold').value === 'true',
                regTo: document.getElementById('regTo').value,
                custAadhar: document.getElementById('custAadhar').value,
                custPhoneNum: document.getElementById('custPhoneNum').value,
                custAdd: document.getElementById('custAdd').value,
                note: document.getElementById('note').value,
            };

            saveButton.textContent = 'Saving...';
            saveButton.disabled = true;

            try {
                const response = await fetch(`https://rajestate.onrender.com/plot/edit-plot/${plotId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                    },
                    body: JSON.stringify(plotDetails),
                });

                if (response.ok) {
                    showModal('Plot details updated successfully!', true);
                } else {
                    alert('Failed to update plot details.');
                }
            } catch (error) {
                console.error('Error saving plot details:', error);
                alert('Error saving plot details.');
            } finally {
                saveButton.textContent = 'Save Changes';
                saveButton.disabled = false;
            }
        }

        let redirectAfterClose = false;

        function showModal(message, shouldRedirect = false) {
            document.getElementById('successMessage').textContent = message;
            document.getElementById('successModal').style.display = 'flex';
            redirectAfterClose = shouldRedirect;
        }

        function closeModal() {
            document.getElementById('successModal').style.display = 'none';
            if (redirectAfterClose) {
                // Go back to the previous page (Plot list)
                window.history.back();
            }
        }
    </script>

</body>
</html>
